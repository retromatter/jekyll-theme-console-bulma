title: jekyll-theme-console-bulma
description: "Terminal-inspired Jekyll theme. Bulma-powered, retro-styled, hacker-approved."
baseurl: "/jekyll-theme-console-bulma"
url: "https://junl.ee"

# Build settings
plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - jekyll-theme-console-bulma.gemspec
  - theme_version.rb
  - Gemfile
  - Gemfile.lock
  - LICENSE.txt
  - CODE_OF_CONDUCT.md
  - README.md
